# release-plz configuration
# https://release-plz.dev/docs/config
#
# Coordinates version bumps, changelog generation, and publishing across the
# five publishable workspace crates. release-plz respects the crates' dependency
# graph and publishes in a valid order:
#   tpt-hf-hub -> tpt-jinja-chat -> tpt-tokenizer-core -> tpt-safetensors-io -> tpt-lora-merge

[workspace]
# Generate a changelog for every crate from Conventional Commits.
changelog_update = true
# Keep the git tag scheme namespaced per crate, e.g. `tpt-hf-hub-v0.1.1`.
git_tag_name = "{{ package }}-v{{ version }}"
git_release_name = "{{ package }} {{ version }}"
# Open a single aggregated release PR for the whole workspace.
release_always = false
# Depend on CI passing before release-plz publishes.
publish_timeout = "30m"

# `tpt-cookbook` sets `publish = false` in its Cargo.toml, so release-plz skips
# it automatically. The blocks below exist so per-crate changelogs land inside
# each crate directory.

[[package]]
name = "tpt-hf-hub"
changelog_path = "crates/tpt-hf-hub/CHANGELOG.md"

[[package]]
name = "tpt-jinja-chat"
changelog_path = "crates/tpt-jinja-chat/CHANGELOG.md"

[[package]]
name = "tpt-tokenizer-core"
changelog_path = "crates/tpt-tokenizer-core/CHANGELOG.md"

[[package]]
name = "tpt-safetensors-io"
changelog_path = "crates/tpt-safetensors-io/CHANGELOG.md"

[[package]]
name = "tpt-lora-merge"
changelog_path = "crates/tpt-lora-merge/CHANGELOG.md"
