[package]
name = "tpt-wasm-demo"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/tpt-ai/tpt-local-ai"
description = "Browser playground for tpt-jinja-chat + tpt-tokenizer-core (WASM)."
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde_json = "1"
tpt-jinja-chat = { path = "../tpt-jinja-chat" }
tpt-tokenizer-core = { path = "../tpt-tokenizer-core", default-features = false }

[profile.release]
opt-level = "s"
lto = true
