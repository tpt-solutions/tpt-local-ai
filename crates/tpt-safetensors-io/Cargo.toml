[package]
name = "tpt-safetensors-io"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Memory-mapped safetensors reader/writer — zero-copy mmap, aligned header, builder API."
keywords = ["safetensors", "ml", "tensor", "mmap", "model"]
categories = ["encoding", "filesystem", "science"]
readme = "README.md"

[features]
default = []
# Read-only parser for GGUF (llama.cpp/ggml) headers, metadata, and tensor
# descriptors. Off by default; enable with `features = ["gguf"]`.
gguf = []

[dependencies]
memmap2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[[example]]
name = "inspect_gguf"
required-features = ["gguf"]
