[package]
name = "tpt-tokenizer-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Pure-Rust BPE and WordPiece tokenizer — no_std + alloc compatible, zero dependencies."
keywords = ["tokenizer", "bpe", "wordpiece", "nlp", "llm"]
categories = ["text-processing", "science", "no-std"]
readme = "README.md"

[features]
# `std` is on by default and only gates the file-loading conveniences. The
# tokenizer logic itself is `no_std` + `alloc` compatible.
default = ["std"]
std = []
# Opt-in Unicode normalization (NFC/NFD/NFKC/NFKD). Off by default to preserve
# the crate's zero-dependency default build; enabling it pulls in the
# `unicode-normalization` crate (no_std + alloc).
normalization = ["dep:unicode-normalization"]

[dependencies]
unicode-normalization = { version = "0.1", default-features = false, optional = true }

[dev-dependencies]
