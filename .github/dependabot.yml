version: 2
updates:
  # Rust / Cargo dependencies across the workspace.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions used by CI.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The MSRV pin in ci.yml must only change when we intentionally bump the
    # workspace rust-version. Dependabot can't know which toolchain tags are
    # real Rust releases, so ignore this action to avoid broken MSRV bumps.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
